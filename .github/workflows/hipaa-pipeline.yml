name: HIPAA Compliance Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Pin actions to full commit SHAs for security compliance
      - name: Checkout repository
        uses: actions/checkout@eef61447b9af4a24d5d3360268753fd0a2d20d82 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@8df1039f7ee633390c51080036dd862ff64c8d8c # v4.5.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 1. Run Unit Tests & Maven Build
      - name: Run Unit Tests and Build Package
        run: mvn clean test package

      # 2. Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@327cd5a69de6c009b2ce714bf89c6f37502e7b8c # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Build & Push Docker Image
      - name: Build and Push Docker Image
        id: push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      # 4. Container Image Vulnerability Scan (Trivy Image Scan)
      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b3f3423dd783f063 # v0.29.0
        with:
          image-ref: 'ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}'
          format: 'json'
          output: 'trivy-image.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # 5. Extract Live Scan Output via jq & Enforce OPA Policy Gate
      - name: Build Policy Input and Enforce OPA Policy Gate
        run: |
          jq '{
            vulnerabilities: {
              critical: ([.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length),
              high: ([.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length)
            }
          }' trivy-image.json > summary.json

          echo "Extracted Live Scan Results for OPA Input:"
          cat summary.json

          CONFTEST_VERSION="0.56.0"
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz
          tar xzf conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

          conftest test summary.json -p policy/

      # 6. Install Cosign & Keyless Image Signing
      - name: Install Cosign CLI
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bec846d972cdd80b840963d3 # v3.8.1

      - name: Sign Container Image (Keyless OIDC)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

      # 7. SBOM Generation for Container & Keyless Attestation
      - name: Generate Container Image SBOM
        uses: anchore/sbom-action@f325610c28d763d6b788860c03d80e7226f823fc # v0.17.9
        with:
          image: 'ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}'
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'

      - name: Attest SBOM with Cosign
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

      # 8. Dynamic Audit Evidence Generation
      - name: Generate Dynamic Compliance Audit Evidence
        if: always()
        run: |
          mkdir -p audit-bundle
          
          FINAL_STATUS="${{ job.status }}"
          
          cat <<EOFAUDIT > audit-bundle/evidence.json
          {
            "compliance_framework": "HIPAA",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "repository": "${{ github.repository }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_attempt": "${{ github.run_attempt }}",
            "commit_sha": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "image_digest": "${{ steps.push.outputs.digest }}",
            "approval_status": "${FINAL_STATUS}"
          }
          EOFAUDIT

          [ -f trivy-image.json ] && cp trivy-image.json audit-bundle/ || true
          [ -f sbom.spdx.json ] && cp sbom.spdx.json audit-bundle/ || true
          [ -f summary.json ] && cp summary.json audit-bundle/ || true

          # SHA256 Integrity Hash Manifest
          cd audit-bundle && sha256sum * > manifest.sha256

      # 9. Upload Immutable Compliance Audit Evidence
      - name: Upload Compliance Audit Evidence
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: hipaa-audit-evidence-${{ github.sha }}
          path: audit-bundle/
          if-no-files-found: error
          retention-days: 90